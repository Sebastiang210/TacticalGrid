[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacticalgrid"
version = "0.1.0"
description = "Juego táctico 2D con búsqueda y toma de decisiones"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
include = ["tacticalgrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
